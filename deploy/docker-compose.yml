version: "2.4"

services:
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3321:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football-net

  api:
    build:
      context: ..
      dockerfile: deploy/api-service/Dockerfile
    container_name: football-api
    restart: always
    ports:
      - "7001:7001"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - football-net

  scraper:
    build:
      context: ..
      dockerfile: deploy/scraper-service/Dockerfile
    container_name: football-scraper
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-600}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-20}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - football-net

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    container_name: football-frontend
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - football-net

volumes:
  mysql_data:

networks:
  football-net:
    driver: bridge
