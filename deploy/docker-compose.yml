version: "2.4"

services:
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: football_betting_2024
      MYSQL_DATABASE: football_betting
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3321:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pfootball_betting_2024"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football-net

  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: football-api
    restart: always
    ports:
      - "7001:7001"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: football_betting_2024
      MYSQL_DATABASE: football_betting
      WECHAT_APPID: wx5b2bc2de132728b8
      WECHAT_SECRET: c4370b66b44a8f7f5a70bfd548007a8a
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - football-net

  scraper:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: football-scraper
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: football_betting_2024
      MYSQL_DATABASE: football_betting
      SYNC_INTERVAL_SECONDS: "600"
      HTTP_TIMEOUT: "20"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - football-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-frontend
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - football-net

volumes:
  mysql_data:

networks:
  football-net:
    driver: bridge
